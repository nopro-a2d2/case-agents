[project]
name = "case-agent"
version = "0.1.0"
description = "Lawyer-facing agent: case-document Q&A, analysis artifacts, and brief drafting on top of LangChain and Vertex AI."
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-google-vertexai>=2.0.0",
    "langchain-google-genai>=2.0",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.2.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "google-genai>=1.0",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
obs = ["langfuse>=4.0.1", "langsmith>=0.8.0"]
wiki = ["langfuse>=4.0.1", "langsmith>=0.8.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
case-agent = "case_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["case_agent"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
